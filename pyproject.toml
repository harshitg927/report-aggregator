[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-aggregator"
version = "0.1.0"
description = "Merge N FOSSology-generated reports into one deduplicated report of the same format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
report-aggregator = "report_aggregator.cli:main"
report-aggregator-api = "report_aggregator.api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "fossology>=4.0.0,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/report_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
